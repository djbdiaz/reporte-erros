<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes — QA Chat Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Cabinet+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface2: #f0ede6;
    --border: #ddd9d0; --border-dark: #c4bfb3;
    --accent: #1a1a2e; --green: #2d6a4f;
    --text: #1a1a1a; --muted: #7a7570;
    --font-head: 'Cabinet Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --status-aberto: #1d4ed8; --status-aberto-bg: #eff6ff;
    --status-analise: #b45309; --status-analise-bg: #fffbeb;
    --status-usuario: #7e22ce; --status-usuario-bg: #faf5ff;
    --status-resolvido: #2d6a4f; --status-resolvido-bg: #f0fdf4;
    --status-pendente: #6b7280; --status-pendente-bg: #f9fafb;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; padding: 40px 16px 80px; }
  .container { max-width: 900px; margin: 0 auto; }

  .header { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 2px solid var(--accent); display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: var(--font-head); font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  h1 span { color: var(--green); }
  .subtitle { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .novo-btn { background: var(--accent); color: white; border: none; border-radius: 8px; font-family: var(--font-head); font-size: 14px; font-weight: 700; padding: 12px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity 0.2s; }
  .novo-btn:hover { opacity: 0.88; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .stat-value { font-family: var(--font-head); font-size: 28px; font-weight: 800; color: var(--accent); }

  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-input { width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--text); padding: 11px 40px; outline: none; transition: border-color 0.15s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); opacity: 0.7; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; display: none; }
  .search-clear.show { display: block; }

  .filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding: 6px 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .filter-count { font-size: 11px; opacity: 0.7; }

  .lista { display: flex; flex-direction: column; gap: 10px; }
  .reporte-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 20px 24px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; animation: fadeIn 0.25s ease; }
  .reporte-item:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(26,26,46,0.08); }
  .reporte-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .reporte-id { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 3px; }
  .reporte-titulo { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: var(--accent); flex: 1; line-height: 1.3; }
  .status-badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; font-family: var(--font-mono); }
  .badge-aberto { color: var(--status-aberto); background: var(--status-aberto-bg); }
  .badge-analise { color: var(--status-analise); background: var(--status-analise-bg); }
  .badge-usuario { color: var(--status-usuario); background: var(--status-usuario-bg); }
  .badge-resolvido { color: var(--status-resolvido); background: var(--status-resolvido-bg); }
  .badge-default { color: var(--status-pendente); background: var(--status-pendente-bg); }
  .reporte-desc { font-size: 13px; color: var(--muted); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reporte-footer { display: flex; align-items: center; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .reporte-meta { font-size: 11px; color: var(--muted); }
  mark { background: #fef08a; border-radius: 2px; padding: 0 2px; font-style: normal; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .loading-list { display: flex; flex-direction: column; gap: 10px; }
  .skeleton { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 20px 24px; }
  .skel-line { background: var(--surface2); border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
  .skel-title { height: 18px; width: 55%; margin-bottom: 10px; }
  .skel-desc { height: 13px; width: 80%; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto; animation: fadeIn 0.2s ease; }
  .modal-header { padding: 24px 28px 20px; border-bottom: 1.5px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--surface); border-radius: 16px 16px 0 0; }
  .modal-id { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .modal-titulo { font-family: var(--font-head); font-size: 20px; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .modal-close { background: none; border: 1.5px solid var(--border); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }
  .modal-body { padding: 24px 28px; }
  .modal-field { margin-bottom: 20px; }
  .modal-field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .modal-field-value { font-size: 13px; color: var(--text); line-height: 1.7; }
  .modal-field-value.pre { white-space: pre-wrap; word-break: break-word; background: var(--surface2); border-radius: 8px; padding: 14px; border-left: 3px solid var(--green); }
  .modal-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="eyebrow">QA — Chat Inteligente</div>
      <h1>Central de <span>reportes</span></h1>
      <p class="subtitle">Todos os erros reportados pelo suporte.</p>
    </div>
    <a href="index.html" class="novo-btn">+ Novo reporte</a>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">-</div></div>
    <div class="stat-card"><div class="stat-label">Aberto</div><div class="stat-value" id="stat-aberto">-</div></div>
    <div class="stat-card"><div class="stat-label">Em analise</div><div class="stat-value" id="stat-analise">-</div></div>
    <div class="stat-card"><div class="stat-label">Resolvido</div><div class="stat-value" id="stat-resolvido">-</div></div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input class="search-input" id="search-input" type="text"
      placeholder="Buscar por ID (ex: #0001) ou email..."
      oninput="onSearch(this.value)" />
    <button class="search-clear" id="search-clear" onclick="limparBusca()" title="Limpar busca">&#215;</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filtrar('todos', this)">Todos <span class="filter-count" id="fc-todos"></span></button>
    <button class="filter-btn" onclick="filtrar('Aberto', this)">Aberto</button>
    <button class="filter-btn" onclick="filtrar('Em analise', this)">Em analise</button>
    <button class="filter-btn" onclick="filtrar('Erro do usuario', this)">Erro do usuario</button>
    <button class="filter-btn" onclick="filtrar('Resolvido', this)">Resolvido</button>
  </div>

  <div id="lista-container">
    <div class="loading-list">
      <div class="skeleton"><div class="skel-line skel-title"></div><div class="skel-line skel-desc"></div></div>
      <div class="skeleton"><div class="skel-line skel-title"></div><div class="skel-line skel-desc"></div></div>
      <div class="skeleton"><div class="skel-line skel-title"></div><div class="skel-line skel-desc"></div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-id" id="modal-id"></div>
        <div class="modal-titulo" id="modal-titulo"></div>
        <div class="modal-badges" id="modal-badges"></div>
      </div>
      <button class="modal-close" onclick="fecharModalBtn()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <div class="modal-field-label">Email / ID da conta</div>
        <div class="modal-field-value" id="modal-email"></div>
      </div>
      <div class="modal-field">
        <div class="modal-field-label">Descricao do erro</div>
        <div class="modal-field-value pre" id="modal-descricao"></div>
      </div>
      <div class="modal-field" id="modal-reporte-area" style="display:none">
        <div class="modal-field-label">Reporte gerado pela IA</div>
        <div class="modal-field-value pre" id="modal-reporte"></div>
      </div>
      <div class="modal-field">
        <div class="modal-field-label">Data do reporte</div>
        <div class="modal-field-value" id="modal-data"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ipczskhaugnevkkshunl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ij_TvW9mA-kRtZEh_1IkLw_WstqVDWG';

let todosReportes = [];
let filtroAtivo = 'todos';
let buscaAtiva = '';

async function carregarReportes() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/reportes?select=*&order=created_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    todosReportes = await res.json();
    atualizarStats();
    aplicarFiltros();
  } catch(e) {
    document.getElementById('lista-container').innerHTML =
      '<div class="empty"><div class="empty-icon">&#9888;</div>Erro ao carregar reportes.</div>';
  }
}

function normalizeStatus(s) {
  if (!s) return 'Aberto';
  const v = s.toLowerCase().trim();
  if (v === 'pendente' || v === 'aberto') return 'Aberto';
  if (v === 'em analise' || v === 'em analise') return 'Em analise';
  if (v === 'erro do usuario' || v === 'erro do usuario') return 'Erro do usuario';
  if (v === 'resolvido') return 'Resolvido';
  return s;
}

function badgeClass(s) {
  const n = normalizeStatus(s);
  if (n === 'Aberto') return 'badge-aberto';
  if (n === 'Em analise') return 'badge-analise';
  if (n === 'Erro do usuario') return 'badge-usuario';
  if (n === 'Resolvido') return 'badge-resolvido';
  return 'badge-default';
}

function formatarData(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function idFmt(id) {
  return '#' + String(id).padStart(4, '0');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, termo) {
  if (!termo) return escHtml(text);
  const re = new RegExp('(' + escRe(termo) + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function atualizarStats() {
  document.getElementById('stat-total').textContent = todosReportes.length;
  document.getElementById('stat-aberto').textContent =
    todosReportes.filter(r => normalizeStatus(r.status) === 'Aberto').length;
  document.getElementById('stat-analise').textContent =
    todosReportes.filter(r => normalizeStatus(r.status) === 'Em analise').length;
  document.getElementById('stat-resolvido').textContent =
    todosReportes.filter(r => normalizeStatus(r.status) === 'Resolvido').length;
  document.getElementById('fc-todos').textContent = '(' + todosReportes.length + ')';
}

function aplicarFiltros() {
  let lista = todosReportes;

  if (filtroAtivo !== 'todos') {
    lista = lista.filter(r => normalizeStatus(r.status) === filtroAtivo);
  }

  if (buscaAtiva) {
    const termo = buscaAtiva.toLowerCase().replace(/^#/, '');
    lista = lista.filter(r => {
      const idStr = String(r.id).padStart(4, '0');
      const email = (r.email_id || '').toLowerCase();
      return idStr.includes(termo) || email.includes(termo);
    });
  }

  renderizarLista(lista);
}

function renderizarLista(lista) {
  const container = document.getElementById('lista-container');
  if (!lista.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">&#128237;</div>Nenhum reporte encontrado.</div>';
    return;
  }

  const termo = buscaAtiva.replace(/^#/, '');

  const html = lista.map(function(r) {
    const id = idFmt(r.id);
    const email = r.email_id || '-';
    const idHL = highlight(id, termo ? '#' + String(termo).padStart(4,'0') : '');
    const emailHL = highlight(email, termo);
    return '<div class="reporte-item" onclick="abrirModal(' + r.id + ')">' +
      '<div class="reporte-top">' +
        '<div>' +
          '<div class="reporte-id">' + idHL + '</div>' +
          '<div class="reporte-titulo">' + escHtml(r.titulo || 'Sem titulo') + '</div>' +
        '</div>' +
        '<span class="status-badge ' + badgeClass(r.status) + '">' + normalizeStatus(r.status) + '</span>' +
      '</div>' +
      '<div class="reporte-desc">' + escHtml(r.descricao || '-') + '</div>' +
      '<div class="reporte-footer">' +
        '<span class="reporte-meta">&#128100; ' + emailHL + '</span>' +
        '<span class="reporte-meta">&#128336; ' + formatarData(r.created_at) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  container.innerHTML = '<div class="lista">' + html + '</div>';
}

function filtrar(status, btn) {
  filtroAtivo = status;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  aplicarFiltros();
}

function onSearch(val) {
  buscaAtiva = val.trim();
  document.getElementById('search-clear').classList.toggle('show', buscaAtiva.length > 0);
  aplicarFiltros();
}

function limparBusca() {
  buscaAtiva = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('show');
  aplicarFiltros();
}

function abrirModal(id) {
  const r = todosReportes.find(function(x){ return x.id === id; });
  if (!r) return;
  document.getElementById('modal-id').textContent = idFmt(r.id);
  document.getElementById('modal-titulo').textContent = r.titulo || 'Sem titulo';
  document.getElementById('modal-email').textContent = r.email_id || '-';
  document.getElementById('modal-descricao').textContent = r.descricao || '-';
  document.getElementById('modal-data').textContent = formatarData(r.created_at);
  document.getElementById('modal-badges').innerHTML =
    '<span class="status-badge ' + badgeClass(r.status) + '">' + normalizeStatus(r.status) + '</span>';
  var reporteArea = document.getElementById('modal-reporte-area');
  if (r.reporte_gerado) {
    document.getElementById('modal-reporte').textContent = r.reporte_gerado;
    reporteArea.style.display = 'block';
  } else {
    reporteArea.style.display = 'none';
  }
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fecharModal(e) {
  if (e.target === document.getElementById('modal')) fecharModalBtn();
}

function fecharModalBtn() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') fecharModalBtn();
});

carregarReportes();
</script>
</body>
</html>
